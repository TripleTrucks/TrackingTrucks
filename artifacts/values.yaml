# Pinned upstream chart: zot 0.1.128. deploy.sh supplies credentials separately.
replicaCount: 1
image:
  repository: ghcr.io/project-zot/zot
  tag: v2.1.22
persistence: true
pvc:
  storage: 50Gi
  storageClassName: local-path
service:
  type: NodePort
  port: 5000
  nodePort: 30500
httpGet:
  scheme: HTTPS
  port: 5000
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '1', memory: 512Mi}
mountConfig: true
configFiles:
  config.json: |-
    {
      "storage": {"rootDirectory": "/var/lib/registry", "gc": false},
      "http": {
        "address": "0.0.0.0", "port": "5000",
        "tls": {"cert": "/tls/tls.crt", "key": "/tls/tls.key"},
        "auth": {"htpasswd": {"path": "/auth/htpasswd"}},
        "accessControl": {
          "repositories": {
            "trackingtrucks": {
              "policies": [
                {"users": ["jenkins"], "actions": ["read", "create"]},
                {"users": ["reader"], "actions": ["read"]}
              ],
              "defaultPolicy": []
            }
          }
        }
      },
      "extensions": {"search": {"enable": true}, "ui": {"enable": true}},
      "log": {"level": "info"}
    }
externalSecrets:
  - {secretName: artifacts-tls, mountPath: /tls}
  - {secretName: artifacts-users, mountPath: /auth}
